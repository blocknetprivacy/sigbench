[package]
edition = "2024"
name = "p3-recursion"
version = "0.1.0"
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Plonky3 native support for recursive proof composition"
homepage = "https://github.com/Plonky3/Plonky3-recursion"
keywords = [
    "cryptography",
    "SNARK",
    "PLONK",
    "FRI",
    "plonky3",
]
categories = ["cryptography::cryptocurrencies"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Plonky3/Plonky3-recursion"

[features]
parallel = [
    "p3-maybe-rayon/parallel",
    "p3-circuit/parallel",
    "p3-circuit-prover/parallel",
    "p3-poseidon2-circuit-air/parallel",
]

[lib]
name = "p3_recursion"
path = "src/lib.rs"

[dependencies.hashbrown]
version = "0.17.1"

[dependencies.itertools]
version = "0.15.0"
features = ["use_alloc"]
default-features = false

[dependencies.p3-air]
version = "0.8.0"

[dependencies.p3-baby-bear]
version = "0.8.0"

[dependencies.p3-batch-stark]
version = "0.8.0"

[dependencies.p3-binary-dft]
version = "0.8.0"

[dependencies.p3-binary-field]
version = "0.8.0"

[dependencies.p3-binary-pcs]
version = "0.8.0"

[dependencies.p3-blake3]
version = "0.8.0"

[dependencies.p3-bus]
version = "0.8.0"

[dependencies.p3-challenger]
version = "0.8.0"

[dependencies.p3-circuit]
version = "0.1.0"
git = "https://github.com/Plonky3/Plonky3-recursion.git"
rev = "485455c0487a0a71d8fb9ccf9f04258f5c7397d5"

[dependencies.p3-circuit-prover]
version = "0.1.0"
git = "https://github.com/Plonky3/Plonky3-recursion.git"
rev = "485455c0487a0a71d8fb9ccf9f04258f5c7397d5"

[dependencies.p3-commit]
version = "0.8.0"

[dependencies.p3-dft]
version = "0.8.0"

[dependencies.p3-field]
version = "0.8.0"

[dependencies.p3-fri]
version = "0.8.0"

[dependencies.p3-goldilocks]
version = "0.8.0"

[dependencies.p3-keccak]
version = "0.8.0"

[dependencies.p3-koala-bear]
version = "0.8.0"

[dependencies.p3-lookup]
version = "0.8.0"

[dependencies.p3-matrix]
version = "0.8.0"

[dependencies.p3-maybe-rayon]
version = "0.8.0"

[dependencies.p3-merkle-tree]
version = "0.8.0"

[dependencies.p3-multi-stark]
version = "0.8.0"

[dependencies.p3-multilinear-util]
version = "0.8.0"

[dependencies.p3-poseidon2-air]
version = "0.8.0"

[dependencies.p3-poseidon2-circuit-air]
version = "0.1.0"
git = "https://github.com/Plonky3/Plonky3-recursion.git"
rev = "485455c0487a0a71d8fb9ccf9f04258f5c7397d5"

[dependencies.p3-sumcheck]
version = "0.8.0"

[dependencies.p3-symmetric]
version = "0.8.0"

[dependencies.p3-uni-stark]
version = "0.8.0"

[dependencies.p3-util]
version = "0.8.0"

[dependencies.p3-whir]
version = "0.8.0"

[dependencies.postcard]
version = "1.1.3"
features = ["alloc"]

[dependencies.rand]
version = "0.10.3"
features = ["std_rng"]
default-features = false

[dependencies.serde]
version = "1.0"
features = [
    "derive",
    "alloc",
]
default-features = false

[dependencies.thiserror]
version = "2.0"
default-features = false

[dependencies.tracing]
version = "0.1.44"
features = ["attributes"]
default-features = false

[dependencies.unroll]
version = "0.1.5"
default-features = false

[lints.clippy]
cognitive_complexity = "allow"
match_bool = "warn"
needless_pass_by_value = "warn"
redundant_pub_crate = "allow"
semicolon_if_nothing_returned = "warn"
too_long_first_doc_paragraph = "allow"
transmute_undefined_repr = "allow"
tuple_array_conversions = "allow"
unused_peekable = "allow"

[lints.clippy.all]
level = "warn"
priority = -1

[lints.clippy.nursery]
level = "warn"
priority = -1

[lints.rust]
rust_2024_incompatible_pat = "warn"
unused_must_use = "deny"

[lints.rust.rust_2018_idioms]
level = "deny"
priority = -1

[lints.rustdoc]
all = "warn"
