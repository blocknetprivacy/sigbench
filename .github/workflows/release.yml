name: release

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  NAME: blocknet-bench3

jobs:
  linux-windows:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: x86_64-unknown-linux-gnu,x86_64-pc-windows-gnu
          rustflags: ""

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - run: cargo zigbuild --release --locked -p showcase --target x86_64-unknown-linux-gnu.2.28

      - run: cargo zigbuild --release --locked -p showcase --target x86_64-pc-windows-gnu

      - name: package
        run: |
          mkdir -p dist/pkg
          cp target/x86_64-unknown-linux-gnu/release/showcase "dist/pkg/$NAME-amd64-linux"
          chmod +x "dist/pkg/$NAME-amd64-linux"
          tar -C dist/pkg -czf "dist/$NAME-amd64-linux.tar.gz" "$NAME-amd64-linux"
          cp target/x86_64-pc-windows-gnu/release/showcase.exe "dist/pkg/$NAME-amd64-windows.exe"
          (cd dist/pkg && zip -q "../$NAME-amd64-windows.zip" "$NAME-amd64-windows.exe")
          rm -r dist/pkg

      - uses: actions/upload-artifact@v5
        with:
          name: linux-windows
          path: dist/*
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: aarch64-apple-darwin
          rustflags: ""

      - run: cargo build --release --locked -p showcase --target aarch64-apple-darwin

      - name: package
        run: |
          mkdir -p dist/pkg
          cp target/aarch64-apple-darwin/release/showcase "dist/pkg/$NAME-arm64-macos"
          chmod +x "dist/pkg/$NAME-arm64-macos"
          tar -C dist/pkg -czf "dist/$NAME-arm64-macos.tar.gz" "$NAME-arm64-macos"
          rm -r dist/pkg

      - uses: actions/upload-artifact@v5
        with:
          name: macos
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux-windows, macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - run: cd dist && sha256sum * > SHA256SUMS

      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* --repo "${{ github.repository }}" --title "${{ github.ref_name }}" --generate-notes
