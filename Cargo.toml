[workspace]
members = ["pqc"]

[package]
publish = false
name = "sig-bench"
version = "0.1.0"
edition = "2021"
description = "Head-to-head benchmark: legacy Blocknet RingCT signatures vs Faraday post-quantum STARK spend proofs (time / CPU / memory)."

[[bin]]
name = "sig-bench"
path = "src/main.rs"

[dependencies]
pqc-poc = { path = "pqc" }
blocknet_crypto = { version = "0.18.0", git = "https://github.com/blocknetprivacy/core.git", rev = "89e1aebdbbb5e11ad1d4196d9472c5f8b0956177", package = "crypto-rs" }
argon2 = "0.5"
sha3 = "0.10"
blake2 = "0.10"
ml-kem = "=0.3.2"

[target.'cfg(not(target_os = "macos"))'.dependencies]
cudarc = { version = "=0.19.2", default-features = false, features = ["std", "driver", "nvrtc", "fallback-dynamic-loading", "cuda-12080"] }

[target.'cfg(target_os = "macos")'.dependencies]
metal = "=0.33.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_Foundation",
    "Win32_System_SystemInformation",
] }

[profile.release]
opt-level = 3

[patch."https://github.com/Plonky3/Plonky3-recursion.git"]
p3-recursion = { path = "patches/p3-recursion" }
